[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-breakdown-agent"
version = "0.2.0"
description = "Long-form livestream transcription and event breakdown agent"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
aliyun-oss = ["oss2>=2.18"]

[project.scripts]
live-breakdown = "live_breakdown_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
