name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [live_scout_agent, live_breakdown_agent, live_retro_agent]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liveagent-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: liveagent-studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
